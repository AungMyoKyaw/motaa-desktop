name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release after packaging'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Set up Rust and validate version
        shell: bash
        run: |
          for i in 1 2 3; do
            rustup update stable && break
            echo "rustup update failed (attempt $i), retrying..."
            sleep 5
          done
          rustup override set stable
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "motaa-desktop") | .version')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$version"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=motaa-desktop-$release_tag-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev libx11-xcb-dev libudev-dev libclang-dev \
            libssl-dev pkg-config
      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$compiler) { throw "Windows SDK shader compiler fxc.exe was not found" }
          "GPUI_FXC_PATH=$($compiler.FullName)" >> $env:GITHUB_ENV
      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: |
          xcrun --find metal || xcodebuild -downloadComponent MetalToolchain
          bash scripts/build-macos.sh | tee "$RUNNER_TEMP/motaa-bundle.log"
          app=$(tail -n 1 "$RUNNER_TEMP/motaa-bundle.log")
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/$PACKAGE.zip"
      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin motaa-desktop
          cargo test --release --locked --workspace
          mkdir -p "stage/$PACKAGE" dist
          cp target/release/motaa-desktop "stage/$PACKAGE/"
          cp LICENSE "stage/$PACKAGE/LICENSE"
          mkdir "stage/$PACKAGE/third_party"
          cp third_party/*LICENSE* "stage/$PACKAGE/third_party/"
          cp third_party/xattr/LICENSE-* "stage/$PACKAGE/third_party/"
          ldd "stage/$PACKAGE/motaa-desktop" | tee "$RUNNER_TEMP/motaa-libraries.log"
          if grep -q 'not found' "$RUNNER_TEMP/motaa-libraries.log"; then exit 1; fi
          tar -C stage -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
      - name: Build Windows archive, MSIX, and Store screenshots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --bin motaa-desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "stage/$env:PACKAGE", dist, "store-submission/screenshots", "store-submission/assets" -Force | Out-Null
          Copy-Item target/release/motaa-desktop.exe "stage/$env:PACKAGE/"
          Copy-Item LICENSE "stage/$env:PACKAGE/LICENSE"
          New-Item -ItemType Directory -Path "stage/$env:PACKAGE/third_party" -Force | Out-Null
          Copy-Item third_party/*LICENSE*, third_party/xattr/LICENSE-* "stage/$env:PACKAGE/third_party/"
          Compress-Archive -Path "stage/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip" -Force
          .\packaging\windows\build-msix.ps1 -ExePath target\release\motaa-desktop.exe -Version $env:RELEASE_TAG -OutputMsix "dist/$env:PACKAGE.msix"
          .\packaging\windows\capture-store-screenshots.ps1 -ExePath target\release\motaa-desktop.exe -OutputDir "store-submission/screenshots"
          Copy-Item "dist/$env:PACKAGE.msix" "store-submission/$env:PACKAGE.msix"
          Copy-Item "packaging/windows/assets/StoreIcon300.png" "store-submission/assets/StoreIcon300.png"
          $msixHash = (Get-FileHash -Path "store-submission/$env:PACKAGE.msix" -Algorithm SHA256).Hash.ToLowerInvariant()
          $shotManifest = Get-Content "store-submission/screenshots/screenshots-manifest.json" -Raw | ConvertFrom-Json
          $submissionManifest = [ordered]@{
            product_name = "MOTAA Desktop"
            product_id = "9NRP9CQZHPMZ"
            version = $env:APP_VERSION
            release_tag = $env:RELEASE_TAG
            msix_file = "$env:PACKAGE.msix"
            msix_sha256 = $msixHash
            screenshots = $shotManifest.screenshots
          }
          $submissionManifest | ConvertTo-Json -Depth 5 | Set-Content -Path "store-submission/SUBMISSION_MANIFEST.json" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Upload Microsoft Store submission bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-submission
          path: store-submission/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist
      - name: Verify assets and publish
        working-directory: dist
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n 1)
            release_tag="v$version"
          fi
          package="motaa-desktop-$release_tag"
          assets=("$package-macos-arm64.zip" "$package-macos-x64.zip"
                  "$package-windows-x64.zip" "$package-windows-x64.msix"
                  "$package-linux-x64.tar.gz")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --verify-tag --draft \
              --title "MOTAA Desktop $release_tag" \
              --notes "Public desktop release. See CHANGELOG.md for release notes. macOS bundles are ad-hoc signed and not notarized. The Windows ZIP contains an unsigned portable executable. The Linux archive targets Ubuntu 24.04 x64."
          fi
          if [[ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$release_tag" "${assets[@]}" SHA256SUMS.txt --clobber
            gh release edit "$release_tag" --draft=false
          fi

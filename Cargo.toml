[package]
name = "motaa-desktop"
version = "0.2.8"
edition = "2024"
description = "Offline-first Myanmar astrology desktop workspace built with Rust and GPUI"
license = "AGPL-3.0-only"
repository = "https://github.com/AungMyoKyaw/motaa-desktop"
homepage = "https://github.com/AungMyoKyaw/motaa-desktop"
readme = "README.md"
keywords = ["astrology", "myanmar", "gpui", "desktop"]
categories = ["gui"]

[workspace]
members = ["crates/motaa-engine", "crates/motaa-store"]
resolver = "2"

[dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets", "x11"] }
jiff = { version = "1.0.3", features = ["tzdb-bundle-always"] }
motaa-engine = { path = "crates/motaa-engine" }
motaa-store = { path = "crates/motaa-store" }
rusqlite = "0.37"
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
tzf-rs = "2"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

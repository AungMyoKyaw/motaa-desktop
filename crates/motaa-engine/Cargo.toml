[package]
name = "motaa-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/AungMyoKyaw/motaa-desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
jiff = { version = "1.0.3", features = ["tzdb-bundle-always"] }
astro = "2.0.0"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[package]
name = "motaa-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/AungMyoKyaw/motaa-desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
astro = "2.0.0"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

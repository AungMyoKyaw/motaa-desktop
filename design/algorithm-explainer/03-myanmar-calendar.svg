<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:567px;height:852px;background:#FAF8F0;" width="567px" height="852px" viewBox="0 0 567 852" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="567" height="852" fill="#FAF8F0" style="stroke:none;"/><g class="title" data-source-line="2"><text x="119.585" y="30.78" fill="#000" font-size="14" textLength="326.737" font-weight="700" font-family="Helvetica">Myanmar calendar · Independent calculation flow</text></g><ellipse cx="281.954" cy="60" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="174.914" y="90" width="214.08" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184.914" y="109.24" fill="#282B22" font-size="12" textLength="194.08" font-family="Helvetica">Receive civil date (day, month, year)</text><polygon points="96.237,142,177.566,142,189.566,154,177.566,166,96.237,166,84.237,154,96.237,142" fill="#E8DDAF" style="stroke:#756020;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="140.901" y="174.47" fill="#000" font-size="11" textLength="31.786" font-family="Helvetica">Hybrid</text><text x="96.237" y="156.97" fill="#282B22" font-size="11" textLength="81.329" font-family="Helvetica">Calendar mode?</text><rect x="55.528" y="197" width="162.746" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.528" y="216.24" fill="#282B22" font-size="12" textLength="142.746" font-family="Helvetica">Use 1582 reform boundary</text><text x="65.528" y="228.24" fill="#282B22" font-size="12" textLength="73.383" font-family="Helvetica">JDN 2361222</text><polygon points="281.845,142,330.76,142,342.76,154,330.76,166,281.845,166,269.845,154,281.845,142" fill="#E8DDAF" style="stroke:#756020;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="281.845" y="156.97" fill="#282B22" font-size="11" textLength="48.915" font-family="Helvetica">Gregorian</text><text x="342.76" y="151.47" fill="#000" font-size="11" textLength="28.741" font-family="Helvetica">Julian</text><rect x="238.274" y="186" width="136.057" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="248.274" y="205.24" fill="#282B22" font-size="12" textLength="116.057" font-family="Helvetica">Apply Gregorian rules</text><rect x="394.331" y="200.5" width="114.049" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="404.331" y="219.74" fill="#282B22" font-size="12" textLength="94.049" font-family="Helvetica">Apply Julian rules</text><rect x="174.24" y="281" width="215.428" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184.24" y="300.24" fill="#282B22" font-size="12" textLength="195.428" font-family="Helvetica">Calculate integer Julian Day Number</text><rect x="139.901" y="333" width="284.105" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.901" y="352.24" fill="#282B22" font-size="12" textLength="264.105" font-family="Helvetica">Estimate Myanmar year using solar-year constant</text><text x="149.901" y="364.24" fill="#282B22" font-size="12" textLength="109.395" font-family="Helvetica">and Myanmar epoch</text><rect x="174.914" y="397" width="214.08" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184.914" y="416.24" fill="#282B22" font-size="12" textLength="194.08" font-family="Helvetica">Select era-specific watat parameters</text><text x="184.914" y="428.24" fill="#282B22" font-size="12" textLength="80.725" font-family="Helvetica">and exceptions</text><rect x="184.254" y="461" width="195.4" height="44" fill="#FFFEF9" style="stroke:#7560
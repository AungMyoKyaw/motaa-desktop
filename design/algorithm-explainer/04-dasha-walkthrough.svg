<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:585px;height:876px;background:#FAF8F0;" width="585px" height="876px" viewBox="0 0 585 876" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="585" height="876" fill="#FAF8F0" style="stroke:none;"/><g class="title" data-source-line="2"><text x="112.203" y="30.78" fill="#000" font-size="14" textLength="359.352" font-weight="700" font-family="Helvetica">Vimshottari Dasha · Moon longitude to period timeline</text></g><ellipse cx="238.792" cy="60" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="110.397" y="90" width="256.789" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="120.397" y="109.24" fill="#282B22" font-size="12" textLength="236.789" font-family="Helvetica">Get sidereal Moon longitude from ephemeris</text><rect x="124.061" y="142" width="229.461" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="134.061" y="161.24" fill="#282B22" font-size="12" textLength="209.461" font-family="Helvetica">Normalize longitude to 0 .. 360 degrees</text><rect x="120.393" y="194" width="236.797" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="130.393" y="213.24" fill="#282B22" font-size="12" textLength="216.797" font-family="Helvetica">Each of 27 Nakshatras is 13 1/3 degrees</text><rect x="120.543" y="246" width="236.498" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="130.543" y="265.24" fill="#282B22" font-size="12" textLength="216.498" font-family="Helvetica">Index = floor(longitude / 13.3333333333)</text><rect x="151.055" y="298" width="175.473" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.055" y="317.24" fill="#282B22" font-size="12" textLength="134.396" font-family="Helvetica">Progress = fractional part</text><text x="161.055" y="329.24" fill="#282B22" font-size="12" textLength="155.473" font-family="Helvetica">of longitude / 13.3333333333</text><rect x="119.06" y="362" width="239.463" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="129.06" y="381.24" fill="#282B22" font-size="12" textLength="219.463" font-family="Helvetica">Look up original 21-entry Nakshatra table</text><rect x="153.083" y="414" width="171.418" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="163.083" y="433.24" fill="#282B22" font-size="12" textLength="135.721" font-family="Helvetica">Derive active lord + years</text><text x="163.083" y="445.24" fill="#282B22" font-size="12" textLength="151.418" font-family="Helvetica">and nine-lord 120-year cycle</text><rect x="120.739" y="478" width="236.105" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="130.739" y="497.24" fill="#282B22" font-size="12" textLength="216.105" font-family="Helvetica">Backdate active start using source factor</text><text x="130.739" y="509.24" fill="#282B22" font-size="12" textLength="105.428" font-family="Helvetica">365.25636305 days</text><rect x="144.742" y="542" width="188.1" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="154.742" y="561.24" fill="#282B22" font-size="12" textLength="168.1" font-family="Helvetica">Build subsequent major periods</text><text x="154.742" y="573.24" fill="#282B22" font-size="12" textLength="151.418" font-family="Helvetica">using civil-date year addition</text><rect x="101.383" y="606" width="274.818" height="32" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.383" y="625.24" fill="#282B22" font-size="12" textLength="254.818" font-family="Helvetica">Calculate nested subperiods and active tracking</text><rect x="122.069" y="658" width="233.445" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="132.069" y="677.24" fill="#282B22" font-size="12" textLength="213.445" font-family="Helvetica">Display remaining balance using distinct</text><text x="132.069" y="689.24" fill="#282B22" font-size="12" textLength="134.76" font-family="Helvetica">365.2422-day conversion</text><rect x="116.725" y="722" width="244.133" height="44" fill="#FFFEF9" style="stroke:#756020;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.725" y="741.24" fill="#282B22" font-size="12" textLength="224.133" font-family="Helvetica">Return period boundaries, active selection</text><text x="126.725" y="753.24" fill="#282B22" font-size="12" textLength="143.42" font-family="Helvetica">and traceable assumptions</text><path d="M269.792,776 L269.792,803 L249.792,807 L269.792,811 L269.792,838 A0,0 0 0 0 269.792,838 L479.374,838 A0,0 0 0 0 479.374,838 L479.374,786 L469.374,776 L269.792,776 A0,0 0 0 0 269.792,776" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M469.374,776 L469.374,786 L479.374,786 L469.374,776" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="275.792" y="791.01" fill="#000" font-size="13" textLength="168.346" font-family="Helvetica">Do NOT replace the two year</text><text x="275.792" y="804.01" fill="#000" font-size="13" textLength="129.359" font-family="Helvetica">constants with 365.25.</text><text x="275.792" y="817.01" fill="#000" font-size="13" textLength="188.583" font-family="Helvetica">Their distinct uses are recovered</text><text x="275.792" y="830.01" fill="#000" font-size="13" textLength="153.194" font-family="Helvetica">from the decompiled code.</text><ellipse cx="238.792" cy="807" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="238.792" cy="807" rx="6" ry="6" fil